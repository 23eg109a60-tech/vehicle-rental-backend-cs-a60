services:
  - type: web
    name: vehicle-rental-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/auth/session
    envVars:
      - key: DATABASE_PLATFORM
        value: postgresql
      - key: JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: DB_HOST
        fromDatabase:
          name: vehicle-rental-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vehicle-rental-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: vehicle-rental-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: vehicle-rental-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: vehicle-rental-db
          property: password
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://vehicle-rental-frontend-jrim.onrender.com
      - key: SEED_DEMO_DATA
        value: always

databases:
  - name: vehicle-rental-db
    plan: free
    databaseName: vehicle_rental
